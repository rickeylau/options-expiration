
name: Update Options Expiration

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config.json'
      - 'options_expiration.py'
      - 'test_options_expiration.py'
      - '.github/workflows/update-calendar.yml'

permissions:
  contents: write

concurrency:
  group: options-expiration-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Test calendar
        run: python -m unittest -v

      - name: Generate expiration calendar
        run: python options_expiration.py

      - name: Publish calendar
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add holidays_snapshot.json listed_weeklys.json options-expiration.ics
          if git diff --cached --quiet; then
            echo 'No calendar changes.'
            exit 0
          fi
          git commit -m 'Update options expiration calendar'
          git push origin main
